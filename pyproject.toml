[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-ai"
version = "0.1.0"
description = "Voice-first autonomous desktop assistant with a holographic HUD, neural memory graph, and 51 workstation tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ultron AI contributors" }]
keywords = ["ai-assistant", "voice", "gemini", "pyqt6", "desktop-automation", "hud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Desktop Environment",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8,<1",
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "pytest-mock>=3,<4",
]
windows = [
    "comtypes",
    "pycaw",
    "win10toast",
    "pywin32",
    "wmi",
    "pywinauto",
]

[tool.ruff]
line-length = 100
target-version = "py311"

# Keep the ruleset conservative so existing code passes without a big rewrite.
# New contributions should introduce zero *new* violations of these rules.
[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501", "B008"]
unfixable = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["actions", "core", "memory", "dashboard", "plugins"]
known-third-party = [
    "google", "numpy", "sounddevice", "PyQt6", "edge_tts", "miniaudio",
    "pyttsx3", "speech_recognition", "requests", "bs4", "playwright",
    "yt_dlp", "pyautogui", "pyperclip", "PIL", "cv2", "mss", "pytesseract",
    "psutil", "send2trash", "pptx", "fastapi", "uvicorn", "cryptography",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "silent"
